# Garage（S3 互換ストレージ）を1台だけ動かす。Helm chart を使わず素のマニフェストで書いている。
# 秘密（rpc_secret・admin_token）は install.sh が Secret garage-secrets として作る。Git には入れない。
apiVersion: v1
kind: Namespace
metadata:
  name: garage
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-config
  namespace: garage
data:
  garage.toml: |
    metadata_dir = "/var/lib/garage/meta"
    data_dir = "/var/lib/garage/data"
    db_engine = "sqlite"

    # ノードが1台なので複製しない。ノードを足すときに 3 へ上げる
    replication_factor = 1

    rpc_bind_addr = "0.0.0.0:3901"
    rpc_public_addr = "127.0.0.1:3901"

    [s3_api]
    # Barman（boto3）は region を指定しないと us-east-1 で署名する。合わせておけば設定が1つ減る
    s3_region = "us-east-1"
    api_bind_addr = "0.0.0.0:3900"

    [admin]
    api_bind_addr = "0.0.0.0:3903"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: garage
  namespace: garage
spec:
  serviceName: garage
  replicas: 1
  selector:
    matchLabels: { app: garage }
  template:
    metadata:
      labels: { app: garage }
    spec:
      containers:
        - name: garage
          image: dxflrs/garage:v2.4.1
          env:
            - name: GARAGE_RPC_SECRET
              valueFrom: { secretKeyRef: { name: garage-secrets, key: rpc_secret } }
            - name: GARAGE_ADMIN_TOKEN
              valueFrom: { secretKeyRef: { name: garage-secrets, key: admin_token } }
          ports:
            - { name: s3, containerPort: 3900 }
            - { name: rpc, containerPort: 3901 }
            - { name: admin, containerPort: 3903 }
          volumeMounts:
            - { name: config, mountPath: /etc/garage.toml, subPath: garage.toml }
            - { name: data, mountPath: /var/lib/garage }
          readinessProbe:
            tcpSocket: { port: 3900 }
          resources:
            requests: { memory: 64Mi, cpu: 20m }
            limits: { memory: 256Mi }
      volumes:
        - name: config
          configMap: { name: garage-config }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 20Gi }
---
# クラスタの中からだけ使う。外には出さない
apiVersion: v1
kind: Service
metadata:
  name: garage
  namespace: garage
spec:
  selector: { app: garage }
  ports:
    - { name: s3, port: 3900 }
    - { name: admin, port: 3903 }
