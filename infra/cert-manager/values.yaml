# chart の既定値からの差分だけ。Barman Cloud Plugin が operator との mTLS 証明書を発行させるために入れる。
crds:
  enabled: true
resources:
  requests: { memory: 32Mi, cpu: 10m }
  limits: { memory: 128Mi }
webhook:
  resources:
    requests: { memory: 16Mi, cpu: 10m }
    limits: { memory: 64Mi }
cainjector:
  resources:
    requests: { memory: 32Mi, cpu: 10m }
    limits: { memory: 128Mi }
