# DB 1つ = このファイル1枚。namespace ごと作って、namespace ごと消す。
#
#   kubectl apply  -f databases/demo.yaml   # 作る
#   kubectl delete -f databases/demo.yaml   # 消す（データも消える）
#
# パスワードは CNPG が生成して Secret demo-app に入れる。ここには書かない。
apiVersion: v1
kind: Namespace
metadata:
  name: db-demo
  labels:
    app.kubernetes.io/part-of: home-dbaas
---
# 機体全体で 12GiB しかないので、DB 1つが食い潰せる上限を先に決めておく。
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota
  namespace: db-demo
spec:
  hard:
    requests.memory: 1Gi
    limits.memory: 1Gi
    requests.storage: 4Gi
    persistentvolumeclaims: "2"
---
# limits.memory を Quota で縛ると、limits のない Pod は作成を拒否される。
# CNPG が裏で作る Job などに既定値を当てるための保険。
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: db-demo
spec:
  limits:
    - type: Container
      defaultRequest: { memory: 128Mi, cpu: 50m }
      default: { memory: 256Mi }
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: demo
  namespace: db-demo
spec:
  # 1台構成ではレプリカも同じ機体に乗るので、増やしても HA にはならない。
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
  storage:
    size: 2Gi
  resources:
    requests: { memory: 256Mi, cpu: 100m }
    limits: { memory: 512Mi }
  postgresql:
    parameters:
      shared_buffers: 128MB
  bootstrap:
    initdb:
      database: app
      owner: app
---
# 機体の外（Mac・スマホ）から繋ぐ入口。primary だけに向ける。
# 将来は Traefik の HostSNI でポート1つに集約する（README のロードマップ 6）。
apiVersion: v1
kind: Service
metadata:
  name: demo-external
  namespace: db-demo
spec:
  type: NodePort
  selector:
    cnpg.io/cluster: demo
    cnpg.io/instanceRole: primary
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      nodePort: 30433
