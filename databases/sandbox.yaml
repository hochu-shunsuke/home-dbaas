# DB 1つ = このファイル1枚。namespace ごと作って、namespace ごと消す。
#
#   kubectl apply  -f databases/sandbox.yaml   # 作る
#   kubectl delete -f databases/sandbox.yaml   # 消す（データも消える）
#
# パスワードは CNPG が生成して Secret sandbox-app に入れる。ここには書かない。
apiVersion: v1
kind: Namespace
metadata:
  name: db-sandbox
  labels:
    app.kubernetes.io/part-of: home-dbaas
---
# 機体全体で 12GiB しかないので、DB 1つが食い潰せる上限を先に決めておく。
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota
  namespace: db-sandbox
spec:
  hard:
    requests.memory: 1Gi
    limits.memory: 1Gi
    requests.storage: 4Gi
    persistentvolumeclaims: "2"
---
# limits.memory を Quota で縛ると、limits のない Pod は作成を拒否される。
# CNPG が裏で作る Job などに既定値を当てるための保険。
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: db-sandbox
spec:
  limits:
    - type: Container
      defaultRequest: { memory: 128Mi, cpu: 50m }
      default: { memory: 256Mi }
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: sandbox
  namespace: db-sandbox
spec:
  # 1台構成ではレプリカも同じ機体に乗るので、増やしても HA にはならない。
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
  storage:
    size: 2Gi
  resources:
    requests: { memory: 256Mi, cpu: 100m }
    limits: { memory: 512Mi }
  postgresql:
    parameters:
      shared_buffers: 128MB
  bootstrap:
    initdb:
      database: app
      owner: app
  # WAL を書くそばから Garage へ送り続ける。これがあるので「任意の時点」へ戻せる（PITR）
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: sandbox-backup
---
# バックアップの置き場所。鍵（Secret backup-s3）は infra/garage/grant.sh が置く。Git には入れない
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: sandbox-backup
  namespace: db-sandbox
spec:
  retentionPolicy: "7d"
  configuration:
    # 実際の保存先は s3://cnpg-backups/sandbox/（クラスタ名が自動で付く）
    destinationPath: s3://cnpg-backups/
    endpointURL: http://garage.garage.svc:3900
    s3Credentials:
      accessKeyId: { name: backup-s3, key: ACCESS_KEY_ID }
      secretAccessKey: { name: backup-s3, key: ACCESS_SECRET_KEY }
    wal:
      compression: gzip
    data:
      compression: gzip
  # Postgres の Pod に相乗りする送信係（サイドカー）の上限。Quota の内側に収める
  instanceSidecarConfiguration:
    resources:
      requests: { memory: 64Mi, cpu: 20m }
      limits: { memory: 256Mi }
---
# 毎日 JST 03:00 にベースバックアップ。作成直後にも1回取る
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: sandbox-daily
  namespace: db-sandbox
spec:
  schedule: "0 0 18 * * *"   # 秒 分 時 日 月 曜日（UTC）
  immediate: true
  backupOwnerReference: self
  cluster:
    name: sandbox
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
---
# 機体の外（Mac・スマホ）から繋ぐ入口。primary だけに向ける。
# 将来は Traefik の HostSNI でポート1つに集約する（README のロードマップ 6）。
apiVersion: v1
kind: Service
metadata:
  name: sandbox-external
  namespace: db-sandbox
spec:
  type: NodePort
  selector:
    cnpg.io/cluster: sandbox
    cnpg.io/instanceRole: primary
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      nodePort: 30432
