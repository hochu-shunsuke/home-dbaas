# 復元訓練: sandbox のバックアップ + WAL から、06:11:37Z 時点の複製を新しい DB として作る。
# 元の sandbox には一切触らない（CNPG の復元は常に「新しいクラスタを作る」）。
# 訓練が終わったらこのファイルを消して push する。
apiVersion: v1
kind: Namespace
metadata:
  name: db-sandbox-restore
  labels:
    app.kubernetes.io/part-of: home-dbaas
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota
  namespace: db-sandbox-restore
spec:
  hard:
    requests.memory: 1Gi
    limits.memory: 1Gi
    requests.storage: 4Gi
    persistentvolumeclaims: "2"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: db-sandbox-restore
spec:
  limits:
    - type: Container
      defaultRequest: { memory: 128Mi, cpu: 50m }
      default: { memory: 256Mi }
---
# sandbox と同じ置き場所を読みにいく。この DB 自身は WAL を書き込まない（plugins を付けない）
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: sandbox-backup
  namespace: db-sandbox-restore
spec:
  configuration:
    destinationPath: s3://cnpg-backups/
    endpointURL: http://garage.garage.svc:3900
    s3Credentials:
      accessKeyId: { name: backup-s3, key: ACCESS_KEY_ID }
      secretAccessKey: { name: backup-s3, key: ACCESS_SECRET_KEY }
    wal:
      compression: gzip
  instanceSidecarConfiguration:
    resources:
      requests: { memory: 64Mi, cpu: 20m }
      limits: { memory: 256Mi }
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: sandbox-restore
  namespace: db-sandbox-restore
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
  storage:
    size: 2Gi
  resources:
    requests: { memory: 256Mi, cpu: 100m }
    limits: { memory: 512Mi }
  postgresql:
    parameters:
      shared_buffers: 128MB
  bootstrap:
    recovery:
      source: sandbox
      recoveryTarget:
        targetTime: "2026-10-13T06:11:37Z"
  externalClusters:
    - name: sandbox
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: sandbox-backup
          serverName: sandbox
