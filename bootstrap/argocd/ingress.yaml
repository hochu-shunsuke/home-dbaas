# Traefik（k3s 同梱）の :80 に /argocd を足すだけ。Traefik 自体の設定は触らない。
# host を書かないので、192.168.0.240 でも 100.78.118.56 でも同じ URL で開ける。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd
  namespace: argocd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /argocd
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
