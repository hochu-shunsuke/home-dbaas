# chart の既定値からの差分だけを書く。全項目は `helm show values argo/argo-cd --version <ver>`。
# 12GiB の機体に合わせて、HA にせず使わない部品は外す。

dex:
  enabled: false          # SSO は使わない。admin でログインする
notifications:
  enabled: false          # 通知は段階7で考える

configs:
  params:
    server.insecure: true     # TLS は付けない（入口は LAN と tailnet だけ。tailnet は経路が暗号化済み）
    server.rootpath: /argocd  # http://<IP>/argocd で開く。ホスト名（DNS）を用意しなくて済む
    server.basehref: /argocd
  cm:
    # Argo CD は既定では子の Application の健康状態を見ない（v1.8 で外された）。
    # これが無いと app-of-apps の sync-wave が「前の wave が建ち終わるのを待つ」にならない。
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil and obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
      return hs

controller:
  resources:
    requests: { memory: 256Mi, cpu: 100m }
    limits: { memory: 768Mi }
repoServer:
  resources:
    requests: { memory: 128Mi, cpu: 50m }
    limits: { memory: 384Mi }
server:
  resources:
    requests: { memory: 64Mi, cpu: 50m }
    limits: { memory: 256Mi }
applicationSet:
  resources:
    requests: { memory: 64Mi, cpu: 20m }
    limits: { memory: 192Mi }
redis:
  resources:
    requests: { memory: 32Mi, cpu: 20m }
    limits: { memory: 128Mi }
