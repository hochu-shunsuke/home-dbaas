# app-of-apps の根。apps/ にある Application を全部作り、sync-wave の順に建てる。
# bootstrap/argocd/install.sh が1回だけ apply する。以降は apps/ を Git で直すだけ。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hochu-shunsuke/home-dbaas.git
    targetRevision: main
    path: apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
