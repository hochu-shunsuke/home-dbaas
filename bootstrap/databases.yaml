# Argo CD に「databases/ を見張って、その通りにクラスタを保て」と教える1枚。
# databases/ にファイルを足す・消す・直す → push → 数分以内にクラスタへ反映される。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: databases
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hochu-shunsuke/home-dbaas.git
    targetRevision: main
    path: databases
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true      # Git から消えた DB はクラスタからも消す
      selfHeal: true   # kubectl で手で変えても Git の状態に戻す
