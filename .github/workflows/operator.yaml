# operator/ が変わったら: テスト → 生成物の確認 → イメージを GHCR へ → タグを Git に書き戻す。
# 書き戻した commit を Argo CD が拾って配備する（CI はクラスタに一切触らない）。
name: operator

on:
  push:
    branches: [main]
    paths:
      - "operator/**"
      - "!operator/config/manager/kustomization.yaml" # タグの書き戻しでは走らせない
      - ".github/workflows/operator.yaml"
  workflow_dispatch:

permissions:
  contents: write # タグの書き戻し
  packages: write # GHCR への push

concurrency:
  group: operator
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/hochu-shunsuke/home-dbaas-operator

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: operator
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: operator/go.sum

      - name: test
        run: |
          go vet ./...
          go test ./api/... ./internal/...

      - name: 生成物（CRD・RBAC・deepcopy）が commit 済みか
        run: |
          make manifests generate
          git diff --exit-code -- config api

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: operator
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: タグを Git に書き戻す
        run: |
          sed -i "s/^  newTag: .*/  newTag: ${{ steps.tag.outputs.tag }}/" config/manager/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "operator: イメージを ${{ steps.tag.outputs.tag }} にする"
          git pull --rebase origin main
          git push origin HEAD:main
