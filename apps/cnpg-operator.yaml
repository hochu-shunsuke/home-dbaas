# CloudNativePG operator。values は infra/cnpg-operator/values.yaml（multi-source の $values 参照）。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    - repoURL: https://cloudnative-pg.github.io/charts
      chart: cloudnative-pg
      targetRevision: 0.29.1   # = CloudNativePG 1.30.1
      helm:
        releaseName: cnpg
        valueFiles: [$values/infra/cnpg-operator/values.yaml]
    - repoURL: https://github.com/hochu-shunsuke/home-dbaas.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    # CNPG の CRD は大きすぎて client-side apply の注釈（last-applied）に収まらない
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    retry: { limit: 10, backoff: { duration: 10s, factor: 2, maxDuration: 3m } }
